<!DOCTYPE html>
<html lang="es" data-theme="amoled">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="description" content="Pulso: registro de entrenamiento, timer de descanso, coach AI y estadisticas." />
<title>Pulso · Entrenamiento</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23000'/><path d='M5 16h4l3-7 4 14 3-7h6' stroke='%23c8ff2e' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
</head>
<body>
<div class="app">
  <header class="appbar" id="appbar">
    <div class="appbar-left">
      <h1 id="appbar-title">Pulso</h1>
      <span id="appbar-sub" class="appbar-sub">Cargando…</span>
    </div>
    <div class="appbar-right">
      <button class="chip" id="btn-streak" data-act="go" data-tab="progreso" title="Racha de entrenamiento">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 3s4 3.6 4 7a4 4 0 0 1-8 0c0-1 .4-2 1-3 0 1.6.8 2.5 1.6 2.5.9 0 1.4-.8 1.4-2 0-1.7-1-3-0-4.5Z" fill="currentColor"/><path d="M7 13.5c0 3.6 2.2 6.5 5 6.5s5-2.9 5-6.5c1.1 1.3 1.5 2.7 1.5 4 0 3-2.9 5.5-6.5 5.5S5.5 20.5 5.5 17.5c0-1.3.4-2.7 1.5-4Z" fill="currentColor" opacity=".45"/></svg>
        <span id="streak-value">0</span>
      </button>
      <button class="chip chip-accent" id="btn-session-clock" hidden data-act="go" data-tab="hoy" title="Sesión en curso">
        <span class="dot-live"></span><span id="session-clock">0:00</span>
      </button>
    </div>
  </header>
  <main class="view" id="view" aria-live="polite"></main>
  <div id="restbar"></div>
  <nav class="nav" id="nav" aria-label="Navegación principal"></nav>
</div>
<div id="modal-root"></div>
<div id="toast-root" class="toasts" aria-live="assertive"></div>
<noscript><div style="padding:24px;font-family:sans-serif;color:#fff">Pulso necesita JavaScript activado.</div></noscript>
