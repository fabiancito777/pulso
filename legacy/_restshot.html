<!DOCTYPE html><html><head><meta charset="utf-8"><title>rest</title>
<style>body{margin:0;background:#111}</style></head>
<body>
<iframe id="fr" src="index.html?demo=1#/hoy" style="width:430px;height:900px;border:0"></iframe>
<script>
setTimeout(function () {
  var fr = document.getElementById('fr');
  var d = fr.contentDocument, w = fr.contentWindow;
  w.App.trainer.start({ exIds: ['dominadas'] });
  w.App.render();
  w.App.trainer.toggleSet(0, 0);
  setTimeout(function () { d.title = 'REST-CARD'; document.title = 'REST-CARD'; }, 900);
}, 3800);
</script>
</body></html>
